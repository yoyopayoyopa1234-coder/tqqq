<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공탐 매매법</title>
<style>
  :root { --bg:#0f1216; --panel:#171b21; --line:#262c35; --fg:#e6e9ee; --muted:#8a93a3; --accent:#f0b429; color-scheme:dark; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  .wrap { padding:12px 12px 40px; max-width:1100px; margin:0 auto; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0; }
  .date { color:var(--muted); font-size:12px; }
  .btn { font:inherit; font-size:12px; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; text-decoration:none; }
  .right { margin-left:auto; display:flex; gap:6px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:14px; overflow:hidden; }
  .panel h2 { margin:0; padding:9px 12px; font-size:14px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; border-bottom:1px solid var(--line); }
  .panel h2 .desc { color:var(--muted); font-weight:400; font-size:12px; }
  .panel h2 .tools { margin-left:auto; display:flex; gap:4px; align-items:center; font-weight:400; font-size:12px; color:var(--muted); }
  .sum { padding:8px 12px; font-size:13px; font-variant-numeric:tabular-nums; border-bottom:1px solid var(--line); line-height:1.6; }
  .sum b { font-weight:600; }
  .up { color:#089981; } .dn { color:#f23645; } .on { color:#5ad445; font-weight:600; } .hot { color:#f23645; font-weight:600; }
  .plot { width:100%; }
  .status { font-size:12px; color:var(--muted); padding:6px 2px; line-height:1.6; }
  .err { color:#f23645; }
  .note { color:var(--muted); font-size:11px; }
  input[type=range] { width:90px; vertical-align:middle; }
  .al { display:grid; gap:4px; }
  .al .row { display:flex; gap:8px; align-items:baseline; }
  .al .ok { color:#5ad445; } .al .no { color:#5d6675; } .al .wr { color:#f0a030; }
  .al .v { color:var(--muted); font-size:12px; margin-left:auto; text-align:right; }
  .stage { display:inline-block; padding:1px 9px; border-radius:999px; font-weight:700; font-size:12px; margin-right:6px; }
  .s-투매 { background:rgba(90,212,69,.15); color:#8be37a; } .s-회복 { background:rgba(90,212,69,.22); color:#a6f095; }
  .s-전환 { background:rgba(41,98,255,.2); color:#8fb0ff; } .s-과열 { background:rgba(242,54,69,.18); color:#ff8a8d; } .s-관망 { background:rgba(139,148,162,.18); color:#c9cfd8; }
  .nav { display:flex; flex-wrap:wrap; gap:4px; } .nav a { font-size:12px; padding:5px 10px; border-radius:6px; color:var(--muted); text-decoration:none; border:1px solid transparent; } .nav a.cur { color:var(--fg); border-color:var(--line); background:var(--panel); }
</style>
</head><body>
<div class="wrap">
  <header>
    <nav class="nav"><a href="index.html">TQQQ 신호판</a><a href="analysis.html">TQQQ 분석</a><a href="qqq3161.html">3/161/185</a><a href="mstr.html">MSTR</a><a href="soxl.html">SOXL</a><a href="qld.html">QLD</a><a href="koru.html">KORU</a><a href="schd.html">SCHD</a><a href="qqqi.html">QQQI</a><a href="xlk.html">XLK</a><a href="fg.html" class="cur">공탐</a><a href="kjp.html">김째아빠</a></nav>
    <h1>공탐 매매법</h1>
    <span class="date" id="today"></span>
  </header>

  <div class="panel" id="fg-panel">
    <h2>공탐 매매법<span class="desc">CNN 공포·탐욕 지수로 살 종목 고르기</span></h2>
    <div class="sum" id="fg-body">불러오는 중…</div>
    <div class="sum" style="border-top:1px solid var(--line)">
      <b>규칙</b> 지수 0~20 <b>TQQQ</b> · 20~50 <b>QLD</b> · 50~100 <b>S&amp;P 500</b>
    </div>
  </div>

</div>
<script>
const $ = s => document.querySelector(s);
$('#today').textContent = new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
/* ── 공탐 매매법: tq.json의 CNN 공포·탐욕 지수 ── */
async function fgPick(){
  try{
    const j=await fetch('tq.json?'+Math.floor(Date.now()/600000)).then(r=>r.json()); const fg=j.fg;
    if(!fg||fg.score==null) throw 0;
    const s=fg.score, [tk,zone]= s<20?['TQQQ','0~20']: s<50?['QLD','20~50']:['S&P 500','50~100'];
    $('#fg-body').innerHTML=`공포·탐욕 지수 <b>${s.toFixed(0)}</b> (${zone}) · 1주 전 ${fg.prev_week!=null?fg.prev_week.toFixed(0):'—'} · 1달 전 ${fg.prev_month!=null?fg.prev_month.toFixed(0):'—'}<br>매수 종목: <b style="color:var(--accent);font-size:16px">${tk}</b>`;
  }catch(e){ $('#fg-body').innerHTML='<span class="note">CNN 데이터를 받지 못했습니다.</span>'; }
}
fgPick();

</script>
</body></html>
