name: update
on:
  schedule:
    - cron: "7 * * * *"   # 예비용 (실제로는 heartbeat가 15분마다 실행)
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/update.yml"]
permissions:
  contents: write
  issues: write
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/tq_ohlc.py
        continue-on-error: true
      - run: python scripts/hynix_ohlc.py
        continue-on-error: true
      - run: python scripts/bt_data.py
        continue-on-error: true
      - run: python scripts/tq40.py
        continue-on-error: true
      - run: python scripts/fg_hist.py
        continue-on-error: true
      - run: python scripts/tq_signals.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/simple_check.py
        continue-on-error: true
      - run: python scripts/crash_data.py
        continue-on-error: true
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python scripts/verify_tv.py
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add tq.json tq_state.json verify_summary.json $(ls fg_hist.json tq40.json bt_data.json tqqq_data.json soxl_data.json koru_data.json simple_check.json crash_raw.json crash.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "data: $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4; do git push && break; git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours; }; sleep 3; done
