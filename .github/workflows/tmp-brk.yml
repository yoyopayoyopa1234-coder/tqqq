name: tmp-brk
on: { push: { branches: [tmp-brk], paths: [".github/workflows/tmp-brk.yml"] } }
permissions: { contents: write }
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          cd scripts && python - <<'PY'
          import json
          from yahoo_data import yahoo
          out = {s: yahoo(s, "1d", "p315532800") for s in ("BRK-A", "BRK-B", "%5EGSPC", "SPY")}
          json.dump(out, open("../brk_tmp.json", "w"), separators=(",", ":"))
          PY
          cd .. && git config user.name bot && git config user.email bot@users.noreply.github.com && git add brk_tmp.json && git commit -m "tmp data" && git push
