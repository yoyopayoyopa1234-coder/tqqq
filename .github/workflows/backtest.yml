name: backtest
on:
  workflow_dispatch:
  push:
    paths: ["scripts/backtest_bigtech.py"]
permissions:
  contents: write
jobs:
  bt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/backtest_bigtech.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add backtest.json
          git diff --cached --quiet || (git commit -m "backtest: $(date -u +%F)" && git pull --rebase && git push)
