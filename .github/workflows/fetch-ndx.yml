name: fetch-ndx (one-off)
on:
  push:
    paths: [".github/workflows/fetch-ndx.yml"]
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json,urllib.request,time
          out={}
          for s in ("^NDX","^GSPC","^IRX"):
            u=f"https://query1.finance.yahoo.com/v8/finance/chart/{s}?period1=0&period2={int(time.time())}&interval=1d"
            for ua in ("curl/8.5.0","Mozilla/5.0"):
              try:
                j=json.loads(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":ua}),timeout=30).read()); break
              except Exception as e: print(s,e); time.sleep(3)
            r=j["chart"]["result"][0]; c=r["indicators"]["quote"][0]["close"]
            out[s]=[[t,round(x,4)] for t,x in zip(r["timestamp"],c) if x is not None]
            print(s,len(out[s]))
          json.dump(out,open("ndx_hist.json","w"))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add ndx_hist.json && git commit -m "data: NDX/SPX 장기 일봉" && for i in 1 2 3; do git push && break; git pull --rebase; done
